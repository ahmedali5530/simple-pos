[package]
name = "shop-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bcrypt = "0.16"
calamine = "0.38.0"
chrono = "0.4.45"
rust_xlsxwriter = "0.102.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["rt"] }
