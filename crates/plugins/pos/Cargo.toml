[package]
name = "plugin-pos"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
platform-kernel = { path = "../../platform-kernel" }
platform-runtime = { path = "../../platform-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros"] }
bcrypt = "0.16"
getrandom = "0.2"
plugin-inventory = { path = "../inventory" }
catalog-contract = { path = "../../contracts/catalog-contract" }
inventory-contract = { path = "../../contracts/inventory-contract" }
sales-contract = { path = "../../contracts/sales-contract" }
printing-contract = { path = "../../contracts/printing-contract" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
platform-runtime = { path = "../../platform-runtime" }
plugin-catalog = { path = "../catalog" }
plugin-inventory = { path = "../inventory" }
plugin-cash = { path = "../cash" }
plugin-printing = { path = "../printing" }
plugin-reports = { path = "../reports" }
