[package]
name = "plugin-fiscal"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
platform-kernel = { path = "../../platform-kernel" }
platform-runtime = { path = "../../platform-runtime" }
platform-sheets = { path = "../../platform-sheets" }
printing-contract = { path = "../../contracts/printing-contract" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.102"
sales-contract = { path = "../../contracts/sales-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tracing = "0.1"
