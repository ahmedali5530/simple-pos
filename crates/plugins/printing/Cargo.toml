[package]
name = "plugin-printing"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
platform-kernel = { path = "../../platform-kernel" }
platform-runtime = { path = "../../platform-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
plugin-pos = { path = "../pos" }
plugin-inventory = { path = "../inventory" }
plugin-cash = { path = "../cash" }
printing-contract = { path = "../../contracts/printing-contract" }
serialport = "4.10"
chrono = "0.4"
