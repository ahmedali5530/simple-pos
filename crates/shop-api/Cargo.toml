[package]
name = "shop-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-frontend = { version = "0.2", optional = true }
shop-core = { path = "../shop-core" }
dotenvy = "0.15"
libc = "0.2"
postgresql_embedded = { version = "0.22", optional = true, features = ["bundled", "tokio"] }
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
bundle = ["dep:axum-frontend", "dep:postgresql_embedded", "dep:rust-embed"]
