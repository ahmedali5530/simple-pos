[package]
name = "chaska-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
chaska-core = { path = "../chaska-core" }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
