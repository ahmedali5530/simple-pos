name: Windows installer

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  nsis:
    runs-on: windows-latest
    env:
      POSTGRESQL_VERSION: "=16.16.0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install the till dependencies
        run: npm ci

      - name: Build the database launcher
        run: cargo build --release --manifest-path src-tauri/Cargo.toml -p pgwrap

      - name: Embed the database launcher
        run: Copy-Item -Force src-tauri\target\release\pgwrap.exe src-tauri\pgwrap.exe

      - name: Drop a cached database bundle
        run: Get-ChildItem -Path src-tauri\target -Recurse -Directory -Filter "postgresql_embedded-*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Build the NSIS installer
        run: npm exec --yes --package=@tauri-apps/cli@2.12.6 -- tauri build --bundles nsis

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
