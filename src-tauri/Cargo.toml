[workspace]
members = ["pgwrap"]

[package]
name = "shop"
version = "0.1.2"
edition = "2021"
description = "Shop till"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shop-api = { path = "../crates/shop-api", features = ["bundle"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
